<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f5b"><title>Choix Optimiseurs</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#14231d;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
header{background:#087f5b;color:#fff;padding:24px 16px 22px;border-radius:0 0 26px 26px}.wrap{max-width:720px;margin:auto}h1{margin:0;font-size:27px}.sub{opacity:.86;margin-top:5px;font-size:14px}
main{padding:14px;max-width:720px;margin:auto}.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:13px;box-shadow:0 2px 12px #0000000b}
.title{font-weight:800;font-size:17px;margin-bottom:12px}.hint{font-size:12px;color:#708079;margin-top:8px}
.roof{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.roof button{min-height:65px;border:1px solid #dce6e1;background:#f7faf8;border-radius:14px;color:#20332b}.roof button.active{border:2px solid #087f5b;background:#e6f6ef}
.roof b{display:block;font-size:13px}.roof span{font-size:11px;color:#64736d}
.pan{display:grid;grid-template-columns:54px 1fr 82px 36px;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid #edf1ef}.pan:last-child{border-bottom:0}.lab{font-weight:750}
select,input{font:inherit;width:100%;height:44px;border:1px solid #d7e1dc;border-radius:12px;background:#fff;padding:0 9px}input{text-align:center}.del{height:44px;border:0;border-radius:12px;background:#f0f3f2;font-size:21px}
.add,.share,.reset{width:100%;height:46px;border:0;border-radius:13px;font:inherit;font-weight:800}.add{background:#e3f4ed;color:#087f5b}.share{background:#087f5b;color:#fff;margin-top:8px}.reset{background:#edf1ef;color:#34463e;margin-top:8px}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toggle button{height:44px;border:0;border-radius:12px;background:#eef2f0;font-weight:800}.toggle .on{background:#087f5b;color:#fff}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#f7faf8;border-radius:15px;padding:13px}.metric small{display:block;color:#687770}.metric b{font-size:27px}
.result{display:flex;justify-content:space-between;align-items:center;padding:5px 0}.pill{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:900}.yes{background:#fff0d5;color:#945900}.no{background:#e1f5ec;color:#08704d}.why{font-size:13px;color:#64736d;margin-top:7px;line-height:1.35}
.reco{padding:13px;border-radius:15px;font-weight:800;margin-bottom:10px}.ok{background:#e1f5ec;color:#08704d}.warn{background:#fff0d5;color:#945900}
@media(max-width:420px){.pan{grid-template-columns:50px 1fr 70px 32px}.roof{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body>
<header><div class="wrap"><h1>☀️ Choix Optimiseurs</h1><div class="sub">Assistant photovoltaïque · V3 chantier</div></div></header>
<main>
<section class="card"><div class="title">Configuration des pans <span id="counter" style="float:right;color:#718078;font-size:13px"></span></div><div id="roof" class="roof"></div><div id="pans"></div><button class="add" onclick="addPan()">＋ Ajouter un pan</button><div class="hint">Renseigne uniquement les pans présents sur l'installation.</div></section>
<section class="card"><div class="title">Ombrages</div><div class="toggle"><button id="shadeNo" onclick="shade=false;render()">NON</button><button id="shadeYes" onclick="shade=true;render()">OUI</button></div></section>
<section class="card"><div class="title">Synthèse chantier</div><div id="recommendation" class="reco"></div><div class="metrics"><div class="metric"><small>Modules totaux</small><b id="total">0</b></div><div class="metric"><small>Orientations</small><b id="ori">0</b></div></div></section>
<section class="card"><div class="title">Résultat MONO</div><div class="result"><span>Chaînes de 11</span><b id="monoChains">0</b></div><div class="result"><span>Optimiseurs</span><span id="mono" class="pill">NON</span></div><div id="monoWhy" class="why"></div></section>
<section class="card"><div class="title">Résultat TRI</div><div class="result"><span>Chaînes de 13</span><b id="triChains">0</b></div><div class="result"><span>Optimiseurs</span><span id="tri" class="pill">NON</span></div><div id="triWhy" class="why"></div></section>
<button class="share" onclick="share()">↗ Partager le résumé</button><button class="reset" onclick="resetApp()">Réinitialiser</button>
</main>
<script>
const dirs=["","N","NE","E","SE","S","SO","O","NO"];
let pans=[{o:"SE",n:"9"},{o:"NO",n:"9"}],shade=false;
function addPan(){if(pans.length<8){pans.push({o:"",n:""});render()}}
function del(i){pans.splice(i,1);if(!pans.length)pans=[{o:"",n:""}];render()}
function exactExcelOptimiseurs(threshold,chains){
  // Reproduit la formule Excel =IF(OR(G2="Oui",G5>G8,C2:C9<threshold),"OUI","NON")
  // Dans Excel, une cellule vide de C2:C9 comparée à un nombre est traitée comme 0.
  const hasEmpty=pans.length<8 || pans.some(p=>p.n==="" || p.n===null || p.n===undefined);
  const small=pans.some(p=>(parseInt(p.n)||0)<threshold);
  return shade || orientationCount()>chains || hasEmpty || small;
}
function orientationCount(){return new Set(pans.map(p=>p.o).filter(Boolean)).size}
function calc(){
 const total=pans.reduce((a,p)=>a+(parseInt(p.n)||0),0), ori=orientationCount();
 const mono=Math.ceil(total/11),tri=Math.ceil(total/13);
 const mo=exactExcelOptimiseurs(4,mono),to=exactExcelOptimiseurs(5,tri);
 document.getElementById("total").textContent=total;document.getElementById("ori").textContent=ori;
 document.getElementById("monoChains").textContent=mono;document.getElementById("triChains").textContent=tri;
 pill("mono",mo);pill("tri",to);
 document.getElementById("monoWhy").textContent=why(mo,4,mono);
 document.getElementById("triWhy").textContent=why(to,5,tri);
 const rec=document.getElementById("recommendation"), any=mo||to;
 rec.className="reco "+(any?"warn":"ok");rec.textContent=any?"🟠 Optimiseurs : OUI selon la logique du fichier Excel.":"🟢 Optimiseurs : NON.";
}
function why(v,t,ch){if(!v)return"Configuration compatible avec les critères du fichier Excel.";let r=[];if(shade)r.push("ombrages = Oui");if(orientationCount()>ch)r.push("plus d'orientations que de chaînes");if(pans.length<8||pans.some(p=>p.n===""||p.n==null))r.push("pan(s) non renseigné(s)");if(pans.some(p=>(parseInt(p.n)||0)<t))r.push("au moins un pan sous "+t+" modules");return "Déclencheur : "+r.join(" · ")+"."}
function pill(id,v){const e=document.getElementById(id);e.textContent=v?"OUI":"NON";e.className="pill "+(v?"yes":"no")}
function render(){
 document.getElementById("counter").textContent=pans.length+" / 8";
 document.getElementById("pans").innerHTML=pans.map((p,i)=>`<div class="pan"><div class="lab">Pan ${i+1}</div><select onchange="pans[${i}].o=this.value;calc()">${dirs.map(d=>`<option value="${d}" ${d===p.o?"selected":""}>${d||"—"}</option>`).join("")}</select><input type="number" min="0" inputmode="numeric" placeholder="Modules" value="${p.n}" onchange="pans[${i}].n=this.value;calc()"><button class="del" onclick="del(${i})">×</button></div>`).join("");
 document.getElementById("roof").innerHTML=pans.map((p,i)=>`<button class="${p.o||p.n?'active':''}" onclick="document.getElementById('pans').children[${i}].scrollIntoView({behavior:'smooth',block:'center'})"><b>Pan ${i+1}</b><span>${p.o||"—"} · ${p.n||0} mod.</span></button>`).join("");
 document.getElementById("shadeNo").className=shade?"":"on";document.getElementById("shadeYes").className=shade?"on":"";
 calc();
}
function share(){const t=`☀️ Choix Optimiseurs\nModules : ${total.textContent}\nOrientations : ${ori.textContent}\nMONO : ${monoChains.textContent} chaînes · optimiseurs ${mono.textContent}\nTRI : ${triChains.textContent} chaînes · optimiseurs ${tri.textContent}`;navigator.share?navigator.share({title:"Choix Optimiseurs",text:t}):navigator.clipboard?.writeText(t)}
function resetApp(){pans=[{o:"",n:""},{o:"",n:""}];shade=false;render()}
render();
</script></body></html>
